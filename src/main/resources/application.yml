server:
  port: 8080

spring:
  application:
    name: multithreading-lab
  threads:
    virtual:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: method
    try-it-out-enabled: true
    filter: true
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,threaddump

logging:
  level:
    com.interview.multithreading: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
